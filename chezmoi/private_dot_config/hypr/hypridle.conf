# Display off only - no lock, no suspend (Omarchy shell handles screensaver + lock).
general {
    # Honor "stay awake" / video inhibitors.
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 330                                   # 5.5 min idle -> display off
    on-timeout = omarchy brightness display off
    on-resume = omarchy brightness display on
}
