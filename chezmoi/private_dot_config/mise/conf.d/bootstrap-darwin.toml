# macOS packages, applied by `mise bootstrap packages apply`.
# chezmoi deploys this file on macOS only (see .chezmoiignore), and
# run_onchange_after_darwin_31-mise-bootstrap-packages runs it when it changes.
# Check what is missing with `mise bootstrap packages status`.
# mise finds third-party taps from the `owner/tap/name` form.

[bootstrap.packages]
# Shell and git
# "brew:fish" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:git-extras" = "latest"
"brew:zellij" = "latest"
"brew:zsh" = "latest"

# Containers
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
# "brew:kubectx" = "latest"
# "brew:kubernetes-cli" = "latest"

# Window management and keyboard
